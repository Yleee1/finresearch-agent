name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests use lightweight fake encoders/scorers, so only NumPy is
      # required; downloading model runtimes in CI would be unnecessary.
      - run: python -m pip install -e . numpy
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
